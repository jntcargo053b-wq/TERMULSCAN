name: Build TERMULScan APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          channel: stable
          cache: true

      - name: Write local.properties
        run: |
          FLUTTER_SDK="$(dirname "$(dirname "$(which flutter)")")"
          echo "flutter.sdk=$FLUTTER_SDK" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties

      - name: Verify fixed testing keystore
        run: |
          test -f android/debug-fixed.keystore
          keytool -list -keystore android/debug-fixed.keystore             -storepass termulscan-debug             -alias termulscan-debug >/dev/null
          echo "Fixed testing keystore: OK"

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build testing APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mkdir -p output
          cp build/app/outputs/flutter-apk/app-release.apk             output/TERMULScan-testing.apk

      - name: Upload testing APK
        uses: actions/upload-artifact@v4
        with:
          name: TERMULScan-testing-apk
          path: output/TERMULScan-testing.apk
          retention-days: 1

      - name: Trigger TERMULSCAN-BUILD production pipeline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BUILD_TOKEN: ${{ secrets.TERMULSCAN_BUILD_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          test -n "$BUILD_TOKEN" || {
            echo "TERMULSCAN_BUILD_TOKEN is not configured."
            exit 1
          }

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $BUILD_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            https://api.github.com/repos/jntcargo053b-wq/TERMULSCAN-BUILD/dispatches \
            -d "{\"event_type\":\"termulscan-production\",\"client_payload\":{\"source_sha\":\"$SOURCE_SHA\",\"source_run_id\":\"$SOURCE_RUN_ID\"}}"

          echo "Production build dispatched to TERMULSCAN-BUILD for $SOURCE_SHA"
