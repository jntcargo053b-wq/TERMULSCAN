name: Build TERMULScan APK (No Production Keystore)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: termulscan-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          channel: stable
          cache: true

      - name: Write local.properties
        run: |
          FLUTTER_SDK="$(dirname "$(dirname "$(which flutter)")")"
          echo "flutter.sdk=$FLUTTER_SDK" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Install Android NDK with retry
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          NDK_VERSION="28.2.13676358"
          NDK_DIR="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          test -x "$SDKMANAGER"
          for attempt in 1 2 3; do
            echo "Installing NDK $NDK_VERSION (attempt $attempt/3)"
            set +o pipefail
            if yes | "$SDKMANAGER" --install "ndk;$NDK_VERSION"; then
              install_status=0
            else
              install_status=$?
            fi
            set -o pipefail
            if [ -f "$NDK_DIR/source.properties" ]; then
              echo "NDK $NDK_VERSION installation verified."
              exit 0
            fi
            echo "NDK install attempt $attempt failed (sdkmanager exit $install_status)."
            rm -rf "$ANDROID_SDK_ROOT/.temp" "$ANDROID_SDK_ROOT/.cache" "$NDK_DIR"
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          echo "NDK $NDK_VERSION installation failed after 3 attempts." >&2
          exit 1

      # Android requires APKs to be signed. Gradle uses the repository's
      # fixed debug/testing keystore when no production keystore is supplied.
      # This build deliberately does not access production signing secrets.
      - name: Build APK without production signing
        run: flutter build apk --release

      - name: Verify APK is present and signed
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          echo "APK valid. It is not signed with the production certificate."

      - name: Publish APK to GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="termulscan-test-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" build/app/outputs/flutter-apk/app-release.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "TERMULScan Test Build ${GITHUB_RUN_NUMBER}" \
            --notes "Testing APK built from commit ${GITHUB_SHA}. Built without production keystore; cannot update an installation signed with the production certificate."
