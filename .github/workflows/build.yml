name: Build TERMULScan Production APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: termulscan-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          channel: stable
          cache: true

      - name: Write local.properties
        run: |
          FLUTTER_SDK="$(dirname "$(dirname "$(which flutter)")")"
          echo "flutter.sdk=$FLUTTER_SDK" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Pull requests validate source only. Never expose signing secrets to PR builds.
      - name: Prepare existing production keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.TERMULSCAN_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || {
            echo "::error::TERMULSCAN_KEYSTORE_BASE64 is missing in TERMULSCAN repository secrets."
            exit 1
          }
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/production.keystore
          test -s android/production.keystore
          chmod 600 android/production.keystore
          echo "Existing production keystore loaded (not generated or replaced)."

      - name: Install Android NDK with retry
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          NDK_VERSION="28.2.13676358"
          NDK_DIR="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          test -x "$SDKMANAGER"
          for attempt in 1 2 3; do
            echo "Installing NDK $NDK_VERSION (attempt $attempt/3)"
            set +o pipefail
            if yes | "$SDKMANAGER" --install "ndk;$NDK_VERSION"; then
              install_status=0
            else
              install_status=$?
            fi
            set -o pipefail
            if [ -f "$NDK_DIR/source.properties" ]; then
              echo "NDK $NDK_VERSION installation verified."
              exit 0
            fi
            echo "NDK install attempt $attempt failed (sdkmanager exit $install_status)."
            rm -rf "$ANDROID_SDK_ROOT/.temp" "$ANDROID_SDK_ROOT/.cache" "$NDK_DIR"
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          echo "NDK $NDK_VERSION installation failed after 3 attempts." >&2
          exit 1

      - name: Build and verify production APK
        if: github.event_name != 'pull_request'
        env:
          TERMULSCAN_KEYSTORE_PATH: ${{ github.workspace }}/android/production.keystore
          TERMULSCAN_KEYSTORE_PASSWORD: ${{ secrets.TERMULSCAN_KEYSTORE_PASSWORD }}
          TERMULSCAN_KEY_ALIAS: ${{ secrets.TERMULSCAN_KEY_ALIAS }}
          TERMULSCAN_KEY_PASSWORD: ${{ secrets.TERMULSCAN_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TERMULSCAN_KEYSTORE_PASSWORD" || {
            echo "::error::TERMULSCAN_KEYSTORE_PASSWORD is missing in TERMULSCAN repository secrets."
            exit 1
          }
          test -n "$TERMULSCAN_KEY_ALIAS" || {
            echo "::error::TERMULSCAN_KEY_ALIAS is missing in TERMULSCAN repository secrets."
            exit 1
          }
          test -n "$TERMULSCAN_KEY_PASSWORD" || {
            echo "::error::TERMULSCAN_KEY_PASSWORD is missing in TERMULSCAN repository secrets."
            exit 1
          }

          flutter build apk --release

          APK="build/app/outputs/flutter-apk/app-release.apk"
          KEYSTORE="android/production.keystore"
          test -s "$APK"
          test -s "$KEYSTORE"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

          KEYSTORE_CERT_SHA256="$(keytool -exportcert -keystore "$KEYSTORE" -alias "$TERMULSCAN_KEY_ALIAS" -storepass "$TERMULSCAN_KEYSTORE_PASSWORD" 2>/dev/null | openssl dgst -sha256 | awk '{print $NF}' | tr '[:upper:]' '[:lower:]')"
          APK_CERT_OUTPUT="$("$APKSIGNER" verify --print-certs --verbose "$APK" 2>&1)"
          APK_CERT_SHA256="$(printf '%s\n' "$APK_CERT_OUTPUT" | sed -nE 's/.*certificate SHA-256 digest: ([0-9A-Fa-f:]+).*/\1/p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test -n "$KEYSTORE_CERT_SHA256"
          test -n "$APK_CERT_SHA256"
          echo "Keystore SHA-256: $KEYSTORE_CERT_SHA256"
          echo "APK signer SHA-256: $APK_CERT_SHA256"
          test "$KEYSTORE_CERT_SHA256" = "$APK_CERT_SHA256" || {
            echo "::error::APK signing certificate does not match the supplied existing production keystore."
            exit 1
          }
          echo "Production APK signature verified."

      - name: Publish APK to GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="termulscan-production-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" build/app/outputs/flutter-apk/app-release.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "TERMULScan Production ${GITHUB_RUN_NUMBER}" \
            --notes "Production APK built from commit ${GITHUB_SHA}. Existing production signing certificate verified."

      - name: Remove temporary keystore
        if: always()
        run: rm -f android/production.keystore
