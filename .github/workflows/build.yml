name: Build TERMULScan APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          channel: stable
          cache: true

      - name: Write local.properties
        run: |
          FLUTTER_SDK="$(dirname "$(dirname "$(which flutter)")")"
          echo "flutter.sdk=$FLUTTER_SDK" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Install Android NDK with retry
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          NDK_VERSION="27.0.12077973"
          NDK_DIR="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          test -x "$SDKMANAGER"
          for attempt in 1 2 3; do
            echo "Installing NDK $NDK_VERSION (attempt $attempt/3)"
            # sdkmanager may close stdin after accepting input; do not let
            # the 'yes' process's expected SIGPIPE mask sdkmanager's result.
            set +o pipefail
            if yes | "$SDKMANAGER" --install "ndk;$NDK_VERSION"; then
              install_status=0
            else
              install_status=$?
            fi
            set -o pipefail
            if [ -f "$NDK_DIR/source.properties" ]; then
              echo "NDK $NDK_VERSION installation verified."
              exit 0
            fi
            echo "NDK install attempt $attempt failed (sdkmanager exit $install_status)."
            rm -rf "$ANDROID_SDK_ROOT/.temp" "$ANDROID_SDK_ROOT/.cache" "$NDK_DIR"
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          echo "NDK $NDK_VERSION installation failed after 3 attempts." >&2
          exit 1

      - name: Build release APK
        if: github.event_name != 'pull_request'
        run: flutter build apk --release

      - name: Publish APK to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: termulscan-build-${{ github.run_number }}
          name: TERMULSCAN Build ${{ github.run_number }}
          body: |
            Automated TERMULSCAN release.
            Commit: ${{ github.sha }}
            Build validation: flutter analyze, flutter test, flutter build apk --release.
          files: build/app/outputs/flutter-apk/app-release.apk
          fail_on_unmatched_files: true
          make_latest: true
