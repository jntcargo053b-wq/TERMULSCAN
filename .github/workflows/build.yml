name: Build TERMULScan APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          channel: stable
          cache: true

      - name: Write local.properties
        run: |
          FLUTTER_SDK="$(dirname "$(dirname "$(which flutter)")")"
          echo "flutter.sdk=$FLUTTER_SDK" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Trigger TERMULSCAN-BUILD production pipeline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BUILD_TOKEN: ${{ secrets.TERMULSCAN_BUILD_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$BUILD_TOKEN" || {
            echo "TERMULSCAN_BUILD_TOKEN is not configured."
            exit 1
          }

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $BUILD_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/jntcargo053b-wq/TERMULSCAN-BUILD/actions/workflows/build.yml/dispatches \
            -d "{\"ref\":\"main\",\"inputs\":{\"source_sha\":\"$SOURCE_SHA\"}}"

          echo "Production workflow dispatched to TERMULSCAN-BUILD for $SOURCE_SHA"
